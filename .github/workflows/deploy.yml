name: Deploy Café Praha to Strato SFTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: 🟢 Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Dependencies installieren
        run: npm ci

      - name: 🏗️ Production Build erstellen
        run: npm run build

      - name: 🧹 Zugangsdaten automatisch bereinigen
        id: clean-inputs
        run: |
          RAW_HOST="${{ secrets.SFTP_SERVER }}"
          # Entferne Protokoll-Präfixe wie sftp:// oder ftp://, Pfad-Anhänge und Leerzeichen
          CLEAN_HOST=$(echo "$RAW_HOST" | sed -e 's|^[a-zA-Z]*://||' -e 's|/.*||' | tr -d '[:space:]')
          CLEAN_USER=$(echo "${{ secrets.SFTP_USERNAME }}" | tr -d '[:space:]')
          echo "host=$CLEAN_HOST" >> "$GITHUB_OUTPUT"
          echo "username=$CLEAN_USER" >> "$GITHUB_OUTPUT"

      - name: 🚀 Per SFTP zu Strato synchronisieren (Delta-Upload)
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ steps.clean-inputs.outputs.host }}
          port: 22
          username: ${{ steps.clean-inputs.outputs.username }}
          password: ${{ secrets.SFTP_PASSWORD }}
          localDir: 'dist'
          remoteDir: '/'
          concurrency: 4
